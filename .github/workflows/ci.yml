name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Smoke test
        run: nvim --headless --noplugin -u NONE -c "set rtp+=." -c "luafile test/smoke.lua"

      - name: Extras color consistency
        run: nvim --headless --noplugin -u NONE -c "set rtp+=." -c "luafile test/extras.lua"
